<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Submit Product Review</title>

<link rel="stylesheet" href="Styles/review.css">
<link rel="stylesheet" href="Styles/styles.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="../firebaseauth.js"></script>
<script src="scripts/review.js"></script>


</head>


<script>
const adminWallet = "0x123..."; // PUT YOUR ADMIN WALLET HERE

async function checkAdmin() {
    if (window.ethereum) {
        const accounts = await ethereum.request({ method: "eth_accounts" });

        if (accounts.length > 0 && accounts[0].toLowerCase() === adminWallet.toLowerCase()) {
            document.getElementById("adminLink").style.display = "block";
        }
    }
}

checkAdmin();
</script>

<h1 class="portal-title">Submit Product Review</h1>
<p class="subtitle">Share your experience with this product</p>

<div class="container">

<div class="review-card">

<label>Product ID</label>
<input type="text" id="productId" placeholder="Enter Product ID">

<div class="qr-options">

<div class="qr-box">
<h3>Scan QR</h3>
<p>Use your camera to scan the product QR code</p>
<button onclick="startCamera()">Start Camera</button>
<div id="reader" class="reader-box"></div>
</div>

<div class="qr-box">
<h3>Upload QR</h3>
<p>Upload an image containing the QR code</p>
<input type="file" id="qrFile" accept="image/*">
</div>

</div>

<label>Your Review</label>
<textarea id="reviewText" placeholder="Write your review"></textarea>

<label>Rating</label>

<div class="star-rating" id="stars">
<span data-value="1">★</span>
<span data-value="2">★</span>
<span data-value="3">★</span>
<span data-value="4">★</span>
<span data-value="5">★</span>
</div>

<button class="submit-btn" onclick="submitReview()">Submit Review</button>

<p id="status"></p>

<button class="logout-btn" onclick="logout()">Logout</button>

</div>

</div>


</body>
</html>
