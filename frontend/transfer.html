<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas | Transfer Ownership</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="Styles/styles.css">
</head>

<body>

<header>
    <h1>VERITAS</h1>
    <p>Secure Product Authentication Platform</p>
</header>

<div class="container">
    <div class="card form-card">
        <i class="fas fa-exchange-alt"></i>
        <h2>Transfer Ownership</h2>
        <p id="accountArea" class="wallet-status">Wallet: <span id="walletAddress">Connecting...</span></p> 

        <div class="input-group">
            <label for="productId"><i class="fas fa-tag"></i> Product ID</label>
            <input type="number" id="productId" placeholder="Enter Product ID">
        </div>

        <div class="input-group">
            <label for="recipientAddress"><i class="fas fa-wallet"></i> New Owner Wallet Address</label>
            <input type="text" id="recipientAddress" placeholder="0x...">
        </div>

        <button class="btn-action" onclick="handleTransfer()">Execute Transfer</button>
        
        <p id="status" class="status-message"></p>
    </div>
</div>

<footer>
    © 2026 Veritas | Built for Trust & Transparency
</footer>
 <script src="app.js"></script>

</body>
</html>
