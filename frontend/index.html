<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veritas</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0a0a0a, #000000 70%);
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 40px 0 20px;
}

header h1 {
    font-size: 48px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00e6e6, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

header p {
    color: #aaa;
    margin-top: 10px;
}

/* GRID */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 40px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
}

/* CARD DESIGN */
.card {
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(79, 172, 254, 0.3);
    transition: 0.4s ease;
}

/* hover effect */
.card:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 0 25px rgba(79, 172, 254, 0.4);
}

/* ICON */
.card i {
    font-size: 55px;
    margin-bottom: 20px;
    background: linear-gradient(45deg, #00e6e6, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* TEXT */
.card h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 1px;
}

.card p {
    font-size: 14px;
    color: #aaa;
    margin-top: 10px;
}

/* LINKS */
a {
    text-decoration: none;
    color: white;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    color: #666;
    font-size: 14px;
}

/* MOBILE RESPONSIVE */
@media (max-width: 768px) {
    .container {
        grid-template-columns: 1fr;
        padding: 20px;
    }

    header h1 {
        font-size: 36px;
    }
}

</style>
</head>

<body>

<header>
    <h1>VERITAS</h1>
    <p>Secure Product Authentication Platform</p>
</header>

<div class="container">

    <a href="manufacturer.html">
        <div class="card">
            <i class="fas fa-industry"></i>
            <h2>Manufacturer</h2>
            <p>Create and register genuine products</p>
        </div>
    </a>

    <a href="seller.html">
        <div class="card">
            <i class="fas fa-store"></i>
            <h2>Seller</h2>
            <p>Verify and sell authentic items</p>
        </div>
    </a>

    <a href="consumer.html">
        <div class="card">
            <i class="fas fa-user-check"></i>
            <h2>Consumer</h2>
            <p>Check product authenticity instantly</p>
        </div>
    </a>

    <a href="admin.html">
        <div class="card">
            <i class="fas fa-user-shield"></i>
            <h2>Admin</h2>
            <p>Monitor and manage the system</p>
        </div>
    </a>

</div>

<footer>
    © 2026 Veritas | Built for Trust & Transparency
</footer>

</body>
</html>
