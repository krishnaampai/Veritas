<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Consumer - Veritas</title>

    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="Styles/consumer.css">

</head>

<body>

<header>
    <h1>Consumer Portal</h1>
    <p>Verify Product Authenticity</p>
</header>

<div class="consumer-container">

    <div class="verify-section">
        <div class="verify-options">

    <!-- CAMERA -->
    <div class="option-card">
        <h3>📷 Scan QR</h3>
        <p class="option-desc">Use your camera to scan the product QR code</p>
        <button id="startScan">Start Camera</button>
        <div id="reader" class="reader-box"></div>
    </div>

    <!-- UPLOAD -->
    <div class="option-card">
        <h3>🖼 Upload QR</h3>
        <p class="option-desc">Upload an image containing the QR code</p>
        <input type="file" id="qr-input-file" accept="image/*">
    </div>

    <!-- MANUAL -->
    <div class="option-card">
        <h3>🔢 Enter Product ID</h3>
        <p class="option-desc">Enter the product ID manually</p>
        <input id="serialInput" placeholder="Enter Product ID">
        <button id="verify">Verify Product</button>
    </div>

</div>

<div id="result" class="status"></div>

<h3 id="timelineTitle" style="display:none;">Ownership History</h3>
<div id="timeline"></div>
<div id="result" class="status"></div>

<h3 id="timelineTitle" style="display:none;">Ownership History</h3>
<div id="timeline"></div>

    </div>

</div>

<button id = "addReviewBtn" onclick="goToReview()">Add Review</button>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="../config.example.js"></script>
    <script defer src="scripts/product.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script defer src="scripts/consumer.js"></script>




</body>
</html>
