<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <link rel="stylesheet" href="./Styles/styles.css">
    <link rel="stylesheet" href="./Styles/admin.css">
</head>

<body>
    <nav class="navbar">
    <h2 class="logo">Veritas</h2>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="consumer.html">Consumer</a></li>
        <li><a href="seller.html">Seller</a></li>
        <li><a href="manufacturer.html">Manufacturer</a></li>
    </ul>
</nav>

    <!-- HEADER -->
    <header>
        <h1>ADMIN PANEL</h1>
        <p>Manage manufacturers on blockchain</p>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="admin-container">
        <div class="wallet-section">
        <button id="connectBtn">
            <i class="fab fa-ethereum"></i> Connect MetaMask
        </button>

        <div id="walletAddress" class="status">
            Wallet not connected
        </div>

        <div id="verificationStatus" class="status"></div>
    </div>

        <!-- FORM CARD -->
        <div id="admin-card" class = "admin-card hidden">
            <h2>Add Manufacturer</h2>

            <form id="manufacturerForm">

                <input 
                    type="text" 
                    id="wallet" 
                    placeholder="Wallet Address (0x...)" 
                    required
                >

                <input 
                    type="text" 
                    id="name" 
                    placeholder="Manufacturer Name" 
                    required
                >

                <input 
                    type="text" 
                    id="license" 
                    placeholder="License Number" 
                    required
                >

                <button type="submit">Add Manufacturer</button>
            </form>

            <!-- STATUS MESSAGE -->
            <div id="statusfield" class="status"></div>

        </div>

    </div>
    
    <script src="../config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
    <script src="./scripts/admin.js"></script>

</body>
</html>
